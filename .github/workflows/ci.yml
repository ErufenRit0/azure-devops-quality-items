name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Package extension (.vsix)
        run: npx tfx-cli extension create --manifest-globs vss-extension.json --output-path dist/quality-items.vsix

      - name: Upload .vsix artifact
        uses: actions/upload-artifact@v4
        with:
          name: quality-items-vsix
          path: dist/quality-items.vsix
